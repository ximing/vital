[package]
name = "vital"
version = "0.0.0"
description = "Vital desktop"
authors = ["Vital"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vital_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# cookies off: bearer only. unsafe-headers: Authorization is a forbidden fetch header.
tauri-plugin-http = { version = "2", default-features = false, features = [
  "rustls-tls",
  "http2",
  "charset",
  "system-proxy",
  "unsafe-headers",
] }
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
