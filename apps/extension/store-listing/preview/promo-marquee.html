<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1400px;
        height: 560px;
        overflow: hidden;
        background: #191c19;
        font-family: Inter, 'PingFang SC', 'Noto Sans SC', sans-serif;
        color: #eaece4;
      }
      .tile {
        width: 1400px;
        height: 560px;
        box-sizing: border-box;
        padding: 72px 88px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: radial-gradient(70% 120% at 88% 20%, #425246 0%, #191c19 55%);
      }
      .mark {
        width: 160px;
        height: 160px;
        color: #a0b497;
      }
      h1 {
        margin: 0;
        font-size: 88px;
        font-weight: 650;
        letter-spacing: -0.045em;
      }
      p {
        margin: 16px 0 0;
        font-size: 28px;
        color: #dce3d7;
      }
    </style>
  </head>
  <body>
    <div class="tile">
      <div>
        <h1>Vital</h1>
        <p>一键把网页、选区和图片存进稍后读</p>
      </div>
      <svg class="mark" viewBox="0 0 32 32" fill="none">
        <path d="M21.5 6.48A11 11 0 1 1 6.48 10.5" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M8 16.5L13 22.5L18.5 10.5L21.5 15.5L26 8" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
  </body>
</html>
