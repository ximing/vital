<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vital</title>
    <script type="module" src="./main.ts"></script>
    <style>
      :root {
        --bg: #fffbf5;
        --surface: #ffffff;
        --fg: #1c1914;
        --muted: #6b6358;
        --border: #eadfce;
        --accent: #e8a317;
        --accent-hover: #c4890f;
        --on-accent: #1c1914;
        --danger: #c45c6a;
        --font: system-ui, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14110c;
          --surface: #1e1a14;
          --fg: #fff6ea;
          --muted: #a39888;
          --border: #3a3228;
          --accent: #f5c84b;
          --accent-hover: #e8a317;
          --on-accent: #1c1914;
          --danger: #e07a86;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-width: 320px;
        min-height: 420px;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 var(--font);
      }
      main {
        padding: 16px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 16px;
        font-weight: 650;
      }
      .muted {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }
      label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin: 10px 0 4px;
      }
      input,
      textarea,
      select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--fg);
        font: inherit;
      }
      textarea {
        min-height: 72px;
        resize: vertical;
      }
      input:focus,
      textarea:focus,
      select:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      button {
        font: inherit;
        cursor: pointer;
        border-radius: 8px;
        border: 0;
      }
      .primary {
        margin-top: 14px;
        width: 100%;
        padding: 9px 12px;
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
      }
      .primary:hover {
        background: var(--accent-hover);
      }
      .ghost {
        background: transparent;
        color: var(--accent);
        padding: 6px 0;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .error {
        color: var(--danger);
        font-size: 13px;
        margin-top: 8px;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li {
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 10px;
        margin-bottom: 8px;
        padding: 10px 12px;
      }
      a.item {
        display: block;
        color: inherit;
        text-decoration: none;
      }
      a.item:hover .title {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .title {
        font-weight: 600;
        font-size: 14px;
      }
      .meta {
        display: flex;
        gap: 10px;
        margin-top: 4px;
      }
      .meta a {
        color: var(--muted);
        font-size: 12px;
      }
      .modes {
        display: flex;
        gap: 8px;
        margin: 10px 0;
      }
      .modes label {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0;
        color: var(--fg);
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <section id="login-view">
        <h1>Vital</h1>
        <p class="muted">在网页登录后，点工具栏即可把当前页收到稍后读。快捷键 Alt+Shift+V。</p>
        <p id="login-error" class="error" hidden></p>
        <button id="login-web" class="primary" type="button">在网页登录</button>
      </section>
      <section id="edit-view" hidden>
        <div class="row">
          <h1>保存并编辑</h1>
          <button id="edit-cancel" class="ghost" type="button">取消</button>
        </div>
        <label for="edit-title">标题</label>
        <input id="edit-title" name="title" maxlength="500" />
        <label for="edit-note">备注</label>
        <textarea id="edit-note" name="note" maxlength="500"></textarea>
        <div class="modes">
          <label><input type="radio" name="edit-mode" value="inbox" checked /> 存到稍后读</label>
          <label><input type="radio" name="edit-mode" value="task" /> 存为待办</label>
        </div>
        <div id="edit-list-wrap" hidden>
          <label for="edit-list">清单</label>
          <select id="edit-list"></select>
        </div>
        <p id="edit-error" class="error" hidden></p>
        <button id="edit-save" class="primary" type="button">保存</button>
      </section>
      <section id="home-view" hidden>
        <div class="row">
          <h1>最近保存</h1>
          <button id="logout" class="ghost" type="button">退出</button>
        </div>
        <p id="empty" class="muted">还没有保存。点击工具栏把这一页收进来。</p>
        <ul id="items"></ul>
        <button id="open-web" class="primary" type="button">打开网页版</button>
      </section>
    </main>
  </body>
</html>
