<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vital</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main>
      <header class="brand-bar">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M21.5 6.48A11 11 0 1 1 6.48 10.5" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M8 16.5L13 22.5L18.5 10.5L21.5 15.5L26 8" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="brand-name">Vital</span>
        <span class="brand-caption">留住此刻，稍后继续</span>
      </header>
      <section id="view-loading" class="center" role="status">
        <span class="spinner" aria-hidden="true"></span>
        <p class="muted">正在解析页面…</p>
      </section>
      <section id="view-login" class="state" hidden>
        <div class="state-icon" aria-hidden="true">↗</div>
        <h1>连接你的 Vital</h1>
        <p class="muted">在网页登录后，点工具栏即可把当前页收进来。快捷键 Alt+Shift+V。</p>
        <button id="login-web" class="primary" type="button">在网页登录</button>
      </section>
      <section id="view-login-done" class="state" hidden>
        <div class="state-icon" aria-hidden="true">✓</div>
        <h1>已连接，开始收集吧</h1>
        <p class="muted">已登录。关闭此页，点工具栏图标开始收集。</p>
      </section>
      <section id="view-capture" hidden>
        <div class="modes" role="group" aria-label="保存模式">
          <button type="button" id="mode-article">文章</button>
          <button type="button" id="mode-selection">选区</button>
          <button type="button" id="mode-task">待办</button>
          <button type="button" id="mode-file">文件</button>
        </div>
        <label for="capture-title">标题</label>
        <input id="capture-title" maxlength="500" />
        <p id="capture-meta" class="meta"></p>
        <label for="capture-note">备注 <span class="optional">选填</span></label>
        <textarea id="capture-note" maxlength="500" placeholder="记下想法，留给稍后的自己"></textarea>
        <div id="capture-list-wrap" hidden>
          <label for="capture-list">集合</label>
          <select id="capture-list"></select>
        </div>
      </section>
      <section id="view-saved" class="state" role="status" hidden>
        <div class="state-icon" aria-hidden="true">✓</div>
        <p id="saved-title" class="saved-title"></p>
        <p id="saved-progress" class="meta" hidden></p>
        <div class="state-actions">
          <a id="saved-open" class="primary" target="_blank" rel="noreferrer">在 Vital 中打开 ↗</a>
          <button id="saved-done" class="ghost" type="button">完成</button>
        </div>
      </section>
      <section id="view-error" class="state" role="alert" hidden>
        <div class="state-icon error" aria-hidden="true">!</div>
        <h1>暂时无法完成</h1>
        <p id="error-message" class="muted"></p>
        <button id="error-retry" class="primary" type="button">重试</button>
      </section>
      <section id="view-recent" hidden>
        <div class="row">
          <h1>最近保存</h1>
          <button id="recent-back" class="ghost" type="button">返回</button>
        </div>
        <p id="recent-empty" class="muted" hidden>还没有保存。</p>
        <ul id="recent-items"></ul>
        <button id="logout" class="ghost" type="button">退出登录</button>
      </section>
      <footer id="footer" hidden>
        <button id="save" class="primary" type="button">保存</button>
        <button id="open-recent" class="ghost" type="button">最近保存</button>
      </footer>
    </main>
  </body>
</html>
