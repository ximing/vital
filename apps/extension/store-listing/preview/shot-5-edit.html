<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 800px;
        overflow: hidden;
        font-family: Inter, 'PingFang SC', 'Noto Sans SC', sans-serif;
        background: #d8d4cc;
      }
      .chrome {
        width: 1280px;
        height: 800px;
        background: #eceae4;
        display: flex;
        flex-direction: column;
      }
      .bar {
        height: 44px;
        background: #e3e0d8;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        border-bottom: 1px solid #d0ccc3;
        box-sizing: border-box;
      }
      .dots span {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 99px;
        background: #c5c0b6;
        margin-right: 5px;
      }
      .omni {
        flex: 1;
        height: 28px;
        border-radius: 14px;
        background: #f7f5f0;
        color: #5c5850;
        font-size: 13px;
        display: flex;
        align-items: center;
        padding: 0 14px;
      }
      .tb {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        overflow: hidden;
        background: #fff;
      }
      .tb img {
        width: 28px;
        height: 28px;
        display: block;
      }
      .page {
        flex: 1;
        background: #faf8f3;
        padding: 56px 120px 80px;
        position: relative;
      }
      .page h1 {
        margin: 0 0 12px;
        font-size: 32px;
        color: #1c1914;
      }
      .page p {
        max-width: 42rem;
        color: #5a5348;
        line-height: 1.7;
        font-size: 16px;
      }
      .toast {
        position: absolute;
        right: 24px;
        bottom: 24px;
        max-width: 360px;
        padding: 10px 14px;
        border-radius: 10px;
        background: #1b211d;
        color: #f3f5f2;
        font: 13px/1.4 Inter, 'PingFang SC', sans-serif;
        box-shadow: 0 8px 24px rgb(27 33 29 / 28%);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 99px;
        background: #1c7a4f;
        flex: none;
      }
      .toast a {
        color: #5fd3a1;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="chrome">
      <div class="bar">
        <div class="dots"><span></span><span></span><span></span></div>
        <div class="omni">example.com/essay</div>
        <div class="tb" title="Save to Vital">
          <img src="../../assets/icon-128.png" alt="" />
        </div>
      </div>
      <div class="page">
        <h1>A long article you are reading</h1>
        <p>Alt+Shift+V saves the current page immediately. The same URL is not saved twice.</p>
        <p>The extension reads this tab only when you choose to save. It does not scan other tabs.</p>
        <div class="toast">
          <span class="dot"></span>
          <span>已保存到 Vital</span>
          <a>打开</a>
        </div>
      </div>
    </div>
  </body>
</html>
