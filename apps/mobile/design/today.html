<!-- 设计稿 · 今天 · 390×844 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vital Mobile · 今天</title>
<style>
  :root{
    --canvas:#F3F5F2; --surface:#FAFBF9; --elevated:#FFFFFF; --muted:#EBEEE9;
    --accent:#1C7A4F; --accent-deep:#155E3D; --accent-subtle:#DFEDE4;
    --ink:#1B211D; --dim:#555E56; --faint:#98A098; --line:#E2E6E0;
    --done:#2F9E63; --doing:#3D6FD1; --soon:#B4761E; --overdue:#CE4A45;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:390px;height:844px;overflow:hidden}
  body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;
    background:var(--canvas);color:var(--ink);position:relative;-webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums}
  .status{height:54px;padding:18px 28px 0;display:flex;justify-content:space-between;align-items:flex-start}
  .status .time{font-size:15px;font-weight:600}
  .status .icons{display:flex;gap:6px;align-items:center}
  .pagehead{height:52px;padding:0 8px 0 20px;display:flex;align-items:flex-end;gap:8px;padding-bottom:6px}
  .pagehead .title{font-size:26px;line-height:34px;font-weight:700}
  .pagehead .date{font-size:13px;color:var(--faint);padding-bottom:5px;flex:1}
  .iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:20px;color:var(--ink);align-self:center}
  /* pulse chips */
  .chips{display:flex;gap:8px;padding:6px 16px 2px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--elevated);
    color:var(--dim);font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap}
  .chip .ic{display:grid;place-items:center}
  /* now card */
  .card{background:var(--elevated);border-radius:14px;box-shadow:0 1px 2px rgb(20 34 24/5%),0 10px 28px rgb(20 34 24/7%)}
  .nowcard{margin:12px 16px 0;padding:16px 16px 16px 20px;position:relative;overflow:hidden}
  .nowcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
  .eyebrow-in{font-size:11px;font-weight:600;letter-spacing:1px;color:var(--accent)}
  .now-time{font-size:34px;line-height:40px;font-weight:700;margin-top:6px}
  .now-meta{font-size:13px;color:var(--dim);margin-top:2px}
  .now-sub{display:flex;align-items:center;margin-top:14px;margin-bottom:8px}
  .now-sub .eb{font-size:11px;font-weight:600;letter-spacing:1px;color:var(--faint);flex:1}
  .swap{height:28px;padding:0 12px;border-radius:14px;background:var(--accent-subtle);color:var(--accent);
    font-size:12px;font-weight:600;display:grid;place-items:center}
  .reco{display:flex;gap:10px}
  .mini{flex:1;background:var(--muted);border-radius:10px;padding:12px;min-width:0}
  .mini .mt{font-size:14px;line-height:20px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .mini .mm{font-size:12px;color:var(--faint);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini .mm .today{color:var(--doing);font-weight:500}
  /* overdue banner */
  .obanner{margin:12px 16px 0;background:rgb(206 74 69/8%);border-radius:12px;padding:12px 14px;
    display:flex;align-items:center;gap:10px}
  .obanner .tx{flex:1;font-size:13px;color:var(--ink)}
  .obanner .tx b{color:var(--overdue)}
  .obanner .act{font-size:13px;font-weight:600;color:var(--accent)}
  /* eyebrow */
  .eyebrow{display:flex;align-items:center;gap:8px;margin:20px 20px 8px;padding:0 4px}
  .eyebrow .lab{font-size:11px;font-weight:600;letter-spacing:1px;color:var(--faint)}
  .eyebrow .cnt{font-size:11px;color:var(--faint)}
  .eyebrow .rule{flex:1;height:1px;background:var(--line)}
  .eyebrow .more{font-size:12px;color:var(--accent);font-weight:500}
  /* habit lane */
  .lane{display:flex;gap:10px;padding:0 16px}
  .habit{width:112px;flex:none;background:var(--elevated);border-radius:14px;padding:12px;
    box-shadow:0 1px 2px rgb(20 34 24/5%),0 10px 28px rgb(20 34 24/7%)}
  .habit .ring{width:32px;height:32px;border-radius:16px;border:1.5px solid var(--faint);display:grid;place-items:center}
  .habit .ring.done{background:var(--done);border-color:var(--done)}
  .habit .hn{font-size:13px;font-weight:500;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .habit .hs{font-size:11px;color:var(--faint);margin-top:2px}
  /* agent card */
  .agentcard{margin:12px 16px 0;padding:14px 16px 8px}
  .agentcard .head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .agentcard .head .eb{font-size:11px;font-weight:600;letter-spacing:1px;color:var(--accent);flex:1}
  .agentcard .head .cnt{font-size:11px;color:var(--faint)}
  .proposal{display:flex;align-items:center;gap:10px;padding:8px 0}
  .proposal .pt{flex:1;font-size:14px;line-height:21px}
  .proposal .yes{font-size:13px;font-weight:600;color:var(--accent)}
  .proposal .no{font-size:13px;color:var(--faint)}
  /* tabbar */
  .tabbar{position:absolute;left:0;right:0;bottom:0;height:78px;background:var(--elevated);
    border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 4px 22px}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint)}
  .tab .lab{font-size:11px;font-weight:500}
  .tab.on{color:var(--accent)}
</style>
</head>
<body>
  <div class="status">
    <span class="time num">9:41</span>
    <span class="icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="20" height="11" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/><path d="M23 4v4c1-.3 1.6-1 1.6-2S24 4.3 23 4z" fill="currentColor" opacity=".4"/></svg>
    </span>
  </div>
  <div class="pagehead">
    <span class="title">今天</span>
    <span class="date num">9月12日 · 周六</span>
    <span class="iconbtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
  </div>

  <div class="chips">
    <span class="chip"><span class="ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3.3 8.2L12 13l8.7-4.8M12 13v9"/></svg></span><span class="num">0</span> 条待处理收集</span>
    <span class="chip"><span class="ic" style="color:var(--soon)"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4-3 5-3 9a4.5 4.5 0 009 0c0-2-1-3-1-3s3 1 3 5a7 7 0 11-14 0c0-6 5-7 6-11z"/></svg></span>复盘连续 <span class="num">4</span> 天</span>
    <span class="chip"><span class="ic" style="color:var(--done)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span>今日复盘已写</span>
  </div>

  <div class="card nowcard">
    <div class="eyebrow-in">当下</div>
    <div class="now-time num">11:00</div>
    <div class="now-meta">接下来约 <span class="num">659</span> 分钟 · 两件都是候选，不必按顺序</div>
    <div class="now-sub"><span class="eb">建议开始</span><span class="swap">换一个</span></div>
    <div class="reco">
      <div class="mini">
        <div class="mt">完成最新博客文章的去 SaaS 化</div>
        <div class="mm"><span class="num">45</span> 分钟 · <span class="today num">今天 18:00</span></div>
      </div>
      <div class="mini">
        <div class="mt">准备季度复盘提纲</div>
        <div class="mm"><span class="num">30</span> 分钟 · <span class="today num">今天</span></div>
      </div>
    </div>
  </div>

  <div class="obanner">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--overdue)" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V13M12 16.5v.01"/></svg>
    <span class="tx"><b class="num">2</b> 项已过期：还图书馆的书、给车续保</span>
    <span class="act">顺延</span>
  </div>

  <div class="eyebrow"><span class="lab">习惯</span><span class="rule"></span><span class="more">管理</span></div>
  <div class="lane">
    <div class="habit">
      <span class="ring done"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span>
      <div class="hn">锻炼</div><div class="hs num">连续 6 天</div>
    </div>
    <div class="habit">
      <span class="ring done"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span>
      <div class="hn">喝水</div><div class="hs num">连续 12 天</div>
    </div>
    <div class="habit">
      <span class="ring"></span>
      <div class="hn">阅读 20 分钟</div><div class="hs num">连续 3 天</div>
    </div>
  </div>

  <div class="eyebrow"><span class="lab">AGENT 提案</span><span class="cnt num">1</span><span class="rule"></span></div>
  <div class="card agentcard" style="margin-top:0">
    <div class="proposal">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--dim)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9l-4.6 1.9L12 15.5l-1.9-4.6L5.5 9l4.6-1.4z"/><path d="M18.5 15l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/></svg>
      <span class="pt">「给车续保」已逾期 4 天，建议今天处理或转入下周</span>
      <span class="yes">采纳</span><span class="no">忽略</span>
    </div>
  </div>

  <div class="tabbar">
    <span class="tab on"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg><span class="lab">今天</span></span>
    <span class="tab"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><path d="M8.5 12.5l2.5 2.5 4.5-5.5"/></svg><span class="lab">待办</span></span>
    <span class="tab"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10 4.8 7 4.5 4 5v13c3-.5 6-.2 8 1.5 2-1.7 5-2 8-1.5V5c-3-.5-6-.2-8 1.5z"/><path d="M12 6.5V19.5"/></svg><span class="lab">收集</span></span>
    <span class="tab"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg><span class="lab">复盘</span></span>
    <span class="tab"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.5-3.5 4.5-5 7.5-5s6 1.5 7.5 5"/></svg><span class="lab">我的</span></span>
  </div>
</body>
</html>
