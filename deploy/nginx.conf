# Host nginx: SPA + /api proxy to the compose-bound API on 127.0.0.1:3010.
#
#   sudo mkdir -p /var/www/vital
#   # copy web dist into /var/www/vital
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/vital
#   sudo ln -sf /etc/nginx/sites-available/vital /etc/nginx/sites-enabled/vital
#   sudo nginx -t && sudo systemctl reload nginx
#
# COOKIE_SECURE=true requires TLS. Keep :80 for ACME. Do not point DNS / WEB_ORIGIN
# at this host until certbot has set server_name to that same host (no placeholder
# hostname in git). Then: certbot --nginx. After TLS, optionally redirect :80 →
# https except /.well-known/acme-challenge/.
#
# X-Forwarded-* : Docker publish makes the API peer the bridge gateway, not
# 127.0.0.1. Fastify trusts loopback + 172.16.0.0/12 only (not trustProxy: true).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/vital;
    index index.html;

    # Media is S3 presign; API is JSON. Headroom for small forms.
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# COOKIE_SECURE=true: browsers drop the refresh cookie on HTTP.
# certbot --nginx fills ssl_certificate* after you set server_name to the real host
# (same host as WEB_ORIGIN). Leave this commented until then.
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     server_name HOST;  # same host as WEB_ORIGIN — not a fake name in git
#     ssl_certificate     /etc/letsencrypt/live/HOST/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/HOST/privkey.pem;
#     include /etc/letsencrypt/options-ssl-nginx.conf;
#     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
#
#     # Duplicate the :80 location blocks (or let certbot copy them).
