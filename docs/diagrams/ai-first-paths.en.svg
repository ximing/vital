<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 392" width="880" height="392" role="img" aria-labelledby="title desc">
  <title id="title">AI-first: two paths</title>
  <desc id="desc">Internally, the Vital agent turns activity into proposals and memory. Externally, other agents reach the same data through the skill, a token, and /api/v1.</desc>

  <rect width="880" height="392" rx="20" fill="#F3F5F2"/>
  <rect x=".5" y=".5" width="879" height="391" rx="20" fill="none" stroke="#E2E6E0"/>

  <rect x="24" y="22" width="3" height="16" rx="1.5" fill="#1C7A4F"/>
  <rect x="448" y="22" width="3" height="16" rx="1.5" fill="#1C7A4F"/>

  <text x="36" y="35" font-family="ui-sans-serif, system-ui, Inter, sans-serif" font-size="11" font-weight="650" letter-spacing="1.4" fill="#1C7A4F">INTERNAL · VITAL AGENT</text>
  <line x1="196" y1="32" x2="424" y2="32" stroke="#E2E6E0" stroke-width="1"/>
  <text x="460" y="35" font-family="ui-sans-serif, system-ui, Inter, sans-serif" font-size="11" font-weight="650" letter-spacing="1.4" fill="#1C7A4F">EXTERNAL · OTHER AGENTS</text>
  <line x1="628" y1="32" x2="848" y2="32" stroke="#E2E6E0" stroke-width="1"/>

  <g font-family="ui-sans-serif, system-ui, Inter, sans-serif">
    <rect x="24" y="52" width="400" height="52" rx="10" fill="#FFFFFF" stroke="#E2E6E0"/>
    <text x="224" y="74" text-anchor="middle" font-size="14" font-weight="600" fill="#1B211D">Task / feedback / habit changes</text>
    <text x="224" y="92" text-anchor="middle" font-size="12" fill="#555E56">Watches what you are doing</text>
    <line x1="224" y1="104" x2="224" y2="120" stroke="#1C7A4F" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M219 116 L224 123 L229 116" fill="none" stroke="#1C7A4F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="24" y="124" width="400" height="52" rx="10" fill="#FFFFFF" stroke="#E2E6E0"/>
    <text x="224" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#1B211D">worker scheduler</text>
    <text x="224" y="164" text-anchor="middle" font-size="12" fill="#555E56">Queue in PostgreSQL · debounce / lease / budget</text>
    <line x1="224" y1="176" x2="224" y2="192" stroke="#1C7A4F" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M219 188 L224 195 L229 188" fill="none" stroke="#1C7A4F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="24" y="196" width="400" height="78" rx="10" fill="#FFFFFF" stroke="#E2E6E0"/>
    <text x="224" y="216" text-anchor="middle" font-size="12" fill="#98A098">cluster · decompose · draft · report · memory · notify</text>
    <rect x="44" y="228" width="96" height="28" rx="14" fill="#DFEDE4"/>
    <text x="92" y="247" text-anchor="middle" font-size="12" font-weight="500" fill="#1C7A4F">Propose</text>
    <text x="154" y="247" text-anchor="middle" font-size="14" fill="#1C7A4F">→</text>
    <rect x="166" y="228" width="104" height="28" rx="14" fill="#1C7A4F"/>
    <text x="218" y="247" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">You accept</text>
    <text x="284" y="247" text-anchor="middle" font-size="14" fill="#1C7A4F">→</text>
    <rect x="296" y="228" width="88" height="28" rx="14" fill="#DFEDE4"/>
    <text x="340" y="247" text-anchor="middle" font-size="12" font-weight="500" fill="#1C7A4F">Memory</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, Inter, sans-serif">
    <rect x="456" y="52" width="400" height="52" rx="10" fill="#FFFFFF" stroke="#E2E6E0"/>
    <text x="656" y="74" text-anchor="middle" font-size="14" font-weight="600" fill="#1B211D">Claude · Codex · other agents</text>
    <text x="656" y="92" text-anchor="middle" font-size="12" fill="#555E56">Same life data, from outside the repo</text>
    <line x1="656" y1="104" x2="656" y2="120" stroke="#1C7A4F" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M651 116 L656 123 L661 116" fill="none" stroke="#1C7A4F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="456" y="124" width="400" height="52" rx="10" fill="#FFFFFF" stroke="#E2E6E0"/>
    <text x="656" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#1B211D">skills/vital</text>
    <text x="656" y="164" text-anchor="middle" font-size="12" fill="#555E56">vt_ personal access token</text>
    <line x1="656" y1="176" x2="656" y2="192" stroke="#1C7A4F" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M651 188 L656 195 L661 188" fill="none" stroke="#1C7A4F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="456" y="196" width="400" height="78" rx="10" fill="#FFFFFF" stroke="#E2E6E0"/>
    <text x="656" y="230" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" fill="#1B211D">/api/v1</text>
    <text x="656" y="252" text-anchor="middle" font-size="12" fill="#555E56">The same HTTP API — not a second database</text>
  </g>

  <path d="M224 274 L224 304 L428 304" fill="none" stroke="#1C7A4F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M656 274 L656 304 L452 304" fill="none" stroke="#1C7A4F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="440" y1="304" x2="440" y2="322" stroke="#1C7A4F" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M435 318 L440 325 L445 318" fill="none" stroke="#1C7A4F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="200" y="328" width="480" height="44" rx="10" fill="#FFFFFF" stroke="#E2E6E0"/>
  <rect x="200" y="328" width="4" height="44" rx="2" fill="#1C7A4F"/>
  <text x="440" y="348" text-anchor="middle" font-family="ui-sans-serif, system-ui, Inter, sans-serif" font-size="11" font-weight="650" letter-spacing="1.1" fill="#1C7A4F">SAME DATA</text>
  <text x="440" y="364" text-anchor="middle" font-family="ui-sans-serif, system-ui, Inter, sans-serif" font-size="12" fill="#555E56">inbox · todos · reports</text>
</svg>
