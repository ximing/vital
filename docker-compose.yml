services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vital_test_user
      POSTGRES_PASSWORD: change-me-test
      POSTGRES_DB: vital_test
    ports: ['5433:5432']
    volumes: [vital-pg-test:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vital_test_user -d vital_test']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  vital-pg-test: {}
