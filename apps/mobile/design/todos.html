<!-- 设计稿 · 待办列表（智能清单：今天） · 390×844 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vital Mobile · 待办</title>
<style>
  :root{
    --canvas:#F3F5F2; --surface:#FAFBF9; --elevated:#FFFFFF; --muted:#EBEEE9;
    --accent:#1C7A4F; --accent-deep:#155E3D; --accent-subtle:#DFEDE4;
    --ink:#1B211D; --dim:#555E56; --faint:#98A098; --line:#E2E6E0;
    --done:#2F9E63; --doing:#3D6FD1; --soon:#B4761E; --overdue:#CE4A45; --fav:#D9A62E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:390px;height:844px;overflow:hidden}
  body{
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;
    background:var(--canvas);color:var(--ink);position:relative;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:tabular-nums}
  /* status bar */
  .status{height:54px;padding:18px 28px 0;display:flex;justify-content:space-between;align-items:flex-start}
  .status .time{font-size:15px;font-weight:600}
  .status .icons{display:flex;gap:6px;align-items:center;color:var(--ink)}
  /* page header */
  .pagehead{height:52px;padding:0 8px 0 8px;display:flex;align-items:center;gap:2px}
  .pagehead .title{flex:1;font-size:26px;line-height:34px;font-weight:700;padding-left:8px;white-space:nowrap;overflow:hidden}
  .iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:20px;color:var(--ink)}
  /* eyebrow */
  .eyebrow{display:flex;align-items:center;gap:8px;margin:22px 20px 6px;padding:0 4px}
  .eyebrow:first-of-type{margin-top:8px}
  .eyebrow .chev{color:var(--faint)}
  .eyebrow .lab{font-size:11px;line-height:14px;font-weight:600;letter-spacing:1px;color:var(--faint)}
  .eyebrow.accent .lab{color:var(--accent)}
  .eyebrow.danger .lab{color:var(--overdue)}
  .eyebrow .cnt{font-size:11px;line-height:14px;color:var(--faint)}
  .eyebrow .rule{flex:1;height:1px;background:var(--line);min-width:16px}
  .eyebrow .act{font-size:12px;line-height:16px;font-weight:500;color:var(--accent)}
  .eyebrow .date{font-size:12px;line-height:16px;color:var(--faint)}
  /* task row */
  .row{display:flex;gap:12px;padding:12px 16px 12px 20px;align-items:flex-start}
  .check{width:24px;height:24px;border-radius:12px;border:1.5px solid var(--faint);flex:none;margin-top:1px}
  .check.overdue{border-color:var(--overdue)}
  .body{flex:1;min-width:0}
  .t1{display:flex;align-items:center;gap:5px}
  .t1 .flag{flex:none}
  .t1 .name{font-size:16px;line-height:22px;font-weight:500}
  .note{font-size:13px;line-height:18px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{display:flex;gap:8px;margin-top:4px;font-size:12px;line-height:16px;align-items:center}
  .meta .d-today{color:var(--doing);font-weight:500}
  .meta .d-over{color:var(--overdue);font-weight:500}
  .meta .d-soon{color:var(--soon);font-weight:500}
  .meta .d-plain{color:var(--dim)}
  .meta .lst,.meta .tag{color:var(--faint)}
  /* fab */
  .fab{position:absolute;right:20px;bottom:98px;width:56px;height:56px;border-radius:28px;background:var(--accent);
    display:grid;place-items:center;color:#fff;box-shadow:0 1px 2px rgb(20 34 24/5%),0 10px 24px rgb(20 34 24/14%)}
  /* tabbar */
  .tabbar{position:absolute;left:0;right:0;bottom:0;height:78px;background:var(--elevated);
    border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 4px 22px}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint)}
  .tab .lab{font-size:11px;line-height:14px;font-weight:500}
  .tab.on{color:var(--accent)}
</style>
</head>
<body>

      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="20" height="11" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/><path d="M23 4v4c1-.3 1.6-1 1.6-2S24 4.3 23 4z" fill="currentColor" opacity=".4"/></svg>
    </span>

    <span class="lab">今天</span><span class="cnt num">4</span><span class="rule"></span><span class="date num">9月12日 周六</span>
  </div>
  <div class="row">
    <span class="check"></span>
    <div class="body">

      <div class="meta"><span class="d-today num">今天</span><span class="lst">收集箱</span></div>
    </div>
  </div>
  <div class="row">
    <span class="check"></span>
    <div class="body">

      <div class="note">买一些东西，侧面距离 160 * 60 的隔板</div>

    </div>

  <div class="fab"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
