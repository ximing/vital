<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vital</title>
    <script type="module" src="./main.ts"></script>
    <style>
      :root {
        --bg: #f4f7f6;
        --surface: #ffffff;
        --fg: #0e1a24;
        --muted: #5b6b72;
        --border: #d5dedb;
        --accent: #0f8f8a;
        --accent-hover: #0a5c5a;
        --on-accent: #ffffff;
        --danger: #c45c6a;
        --font: system-ui, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1214;
          --surface: #1a2a2e;
          --fg: #e6eeec;
          --muted: #8a9a9e;
          --border: #2a3a3e;
          --accent: #2ec9c4;
          --accent-hover: #1ab3b0;
          --on-accent: #0b1214;
          --danger: #e07a86;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-width: 320px;
        min-height: 420px;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 var(--font);
      }
      main {
        padding: 16px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 16px;
        font-weight: 650;
      }
      .muted {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }
      label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin: 10px 0 4px;
      }
      input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--fg);
        font: inherit;
      }
      input:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      button {
        font: inherit;
        cursor: pointer;
        border-radius: 8px;
        border: 0;
      }
      .primary {
        margin-top: 14px;
        width: 100%;
        padding: 9px 12px;
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
      }
      .primary:hover {
        background: var(--accent-hover);
      }
      .ghost {
        background: transparent;
        color: var(--accent);
        padding: 6px 0;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .error {
        color: var(--danger);
        font-size: 13px;
        margin-top: 8px;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li {
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 10px;
        margin-bottom: 8px;
      }
      a.item {
        display: block;
        padding: 10px 12px;
        color: inherit;
        text-decoration: none;
      }
      a.item:hover {
        outline: 2px solid var(--accent);
      }
      .title {
        font-weight: 600;
        font-size: 14px;
      }
      .url {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <section id="login-view">
        <h1>Vital</h1>
        <p class="muted">登录后，点工具栏即可把当前页收到稍后读。</p>
        <form id="login-form">
          <label for="email">邮箱</label>
          <input id="email" name="email" type="email" autocomplete="username" required />
          <label for="password">密码</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
          <p id="login-error" class="error" hidden></p>
          <button class="primary" type="submit">登录</button>
        </form>
      </section>
      <section id="home-view" hidden>
        <div class="row">
          <h1>最近保存</h1>
          <button id="logout" class="ghost" type="button">退出</button>
        </div>
        <p id="empty" class="muted">还没有保存。点击工具栏把这一页收进来。</p>
        <ul id="items"></ul>
        <button id="open-web" class="primary" type="button">打开网页版</button>
      </section>
    </main>
  </body>
</html>
