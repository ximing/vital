<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./popup-mock.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 800px;
        overflow: hidden;
        background: #d8d2c6;
      }
      .stage {
        width: 1280px;
        height: 800px;
        display: grid;
        place-items: center;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="popup">
        <div class="brand-bar">
          <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <path d="M21.5 6.48A11 11 0 1 1 6.48 10.5" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M8 16.5L13 22.5L18.5 10.5L21.5 15.5L26 8" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="brand-name">Vital</span>
          <span class="brand-caption">留住此刻，稍后继续</span>
        </div>
        <section>
          <div class="row">
            <h1>最近保存</h1>
            <span class="ghost">返回</span>
          </div>
          <ul>
            <li>
              <a class="item"><span class="title">把长文先收进来</span></a>
            </li>
            <li>
              <a class="item"><span class="title">下周要处理的链接</span></a>
            </li>
            <li>
              <a class="item"><span class="title">一张参考图</span></a>
            </li>
          </ul>
          <span class="ghost">退出登录</span>
        </section>
      </div>
    </div>
  </body>
</html>
