# Entry nginx on 39.96.159.212 — install as
#   /root/apps/nginx/sites/aimo.plus/vital.conf
# (already included by aimo.plus.conf). Reload: docker exec openresty nginx -t && nginx -s reload.

server {
    listen 443 ssl;
    server_name vital.aimo.plus;
    charset utf-8;

    ssl_certificate     /root/apps/nginx/ssl/aimo.plus.cer;
    ssl_certificate_key /root/apps/nginx/ssl/aimo.plus.key;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 30m;

    client_max_body_size 2m;
    proxy_buffering off;
    proxy_http_version 1.1;

    location / {
        proxy_pass http://222.128.65.91:13005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
    }
}
