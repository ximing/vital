# Host nginx: SPA + /api proxy to the compose-bound API on 127.0.0.1:3010.
#
#   sudo mkdir -p /var/www/vital
#   # copy web dist into /var/www/vital
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/vital
#   sudo ln -sf /etc/nginx/sites-available/vital /etc/nginx/sites-enabled/vital
#   sudo nginx -t && sudo systemctl reload nginx
#
# Set server_name to the real host that matches WEB_ORIGIN (cookie + CORS).
# Do not use a placeholder hostname. HTTPS: certbot --nginx.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/vital;
    index index.html;

    # Media is S3 presign; API is JSON. Headroom for small forms.
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
