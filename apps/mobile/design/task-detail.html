<!-- 设计稿 · 任务详情页 /todos/task/[id] · 390×844 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vital Mobile · 任务详情</title>
<style>
  :root{
    --canvas:#F3F5F2; --surface:#FAFBF9; --elevated:#FFFFFF; --muted:#EBEEE9;
    --accent:#1C7A4F; --accent-deep:#155E3D; --accent-subtle:#DFEDE4;
    --ink:#1B211D; --dim:#555E56; --faint:#98A098; --line:#E2E6E0;
    --done:#2F9E63; --doing:#3D6FD1; --soon:#B4761E; --overdue:#CE4A45; --fav:#D9A62E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:390px;height:844px;overflow:hidden}
  body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;
    background:var(--canvas);color:var(--ink);position:relative;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column}
  .num{font-variant-numeric:tabular-nums}
  .status{height:54px;padding:18px 28px 0;display:flex;justify-content:space-between;align-items:flex-start;flex:none}
  .status .time{font-size:15px;font-weight:600}
  .status .icons{display:flex;gap:6px;align-items:center}
  .pagehead{height:52px;padding:0 8px;display:flex;align-items:center;gap:2px;flex:none}
  .pagehead .sp{flex:1}
  .iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:20px;color:var(--ink)}
  .scroll{flex:1;min-height:0;padding:0 16px 12px}
  /* title block */
  .titleblock{display:flex;gap:14px;align-items:flex-start;padding:8px 4px 0}
  .check28{width:28px;height:28px;border-radius:14px;border:1.5px solid var(--faint);flex:none;margin-top:6px}
  .bigtitle{font-size:22px;line-height:30px;font-weight:700}
  /* quick schedule chips */
  .quick{display:flex;gap:8px;padding:12px 4px 0}
  .chip{height:32px;padding:0 14px;border-radius:16px;border:1px solid var(--line);background:var(--elevated);
    color:var(--dim);font-size:13px;font-weight:500;display:grid;place-items:center}
  .chip.on{background:var(--accent-subtle);border-color:transparent;color:var(--accent);font-weight:600}
  /* prop card */
  .card{background:var(--elevated);border-radius:14px;margin-top:12px;
    box-shadow:0 1px 2px rgb(20 34 24/5%),0 10px 28px rgb(20 34 24/7%)}
  .prop{display:flex;align-items:center;gap:12px;height:46px;padding:0 16px}
  .prop+.prop{border-top:1px solid var(--line)}
  .prop .ic{color:var(--dim);flex:none}
  .prop .lab{font-size:13px;color:var(--faint);width:52px;flex:none}
  .prop .val{flex:1;text-align:right;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prop .val.accent{color:var(--doing);font-weight:500}
  .prop .chev{color:var(--faint);flex:none;margin-left:2px}
  /* eyebrow */
  .eyebrow{display:flex;align-items:center;gap:8px;margin:20px 4px 6px}
  .eyebrow .lab{font-size:11px;font-weight:600;letter-spacing:1px;color:var(--faint)}
  .eyebrow .cnt{font-size:11px;color:var(--faint)}
  .eyebrow .rule{flex:1;height:1px;background:var(--line)}
  /* subtask */
  .sub{display:flex;gap:10px;align-items:center;padding:7px 4px}
  .sub .c{width:20px;height:20px;border-radius:10px;border:1.5px solid var(--faint);flex:none}
  .sub .c.done{background:var(--done);border-color:var(--done);display:grid;place-items:center}
  .sub .n{font-size:14px;color:var(--ink)}
  .sub .n.done{color:var(--dim);text-decoration:line-through}
  .subadd{display:flex;align-items:center;gap:8px;padding:8px 4px;color:var(--accent);font-size:14px;font-weight:500}
  .notes{font-size:14px;line-height:21px;color:var(--dim);padding:2px 4px}
  /* action bar */
  .actionbar{flex:none;background:var(--elevated);border-top:1px solid var(--line);
    box-shadow:0 -2px 12px rgb(20 34 24/6%);padding:12px 16px 26px;display:flex;align-items:center;gap:10px}
  .savestate{flex:1;font-size:12px;color:var(--faint)}
  .btn{height:36px;padding:0 16px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:600}
  .btn.ghost{background:var(--accent-subtle);color:var(--accent)}
  .btn.primary{background:var(--accent);color:#fff}
</style>
</head>
<body>
  <div class="status">
    <span class="time num">9:41</span>
    <span class="icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="20" height="11" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/><path d="M23 4v4c1-.3 1.6-1 1.6-2S24 4.3 23 4z" fill="currentColor" opacity=".4"/></svg>
    </span>
  </div>
  <div class="pagehead">
    <span class="iconbtn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></span>
    <span class="sp"></span>
    <span class="iconbtn" style="color:var(--fav)"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16.5V21M8.5 3.5h7l-1.2 6.5 3.2 3.5H6.5l3.2-3.5z"/></svg></span>
    <span class="iconbtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></span>
  </div>

  <div class="scroll">
    <div class="titleblock">
      <span class="check28"></span>
      <div class="bigtitle">完成最新博客文章的去 SaaS 化</div>
    </div>

    <div class="quick">
      <span class="chip on">今天</span><span class="chip">明天</span><span class="chip">下周</span><span class="chip">清除</span>
    </div>

    <div class="card">
      <div class="prop">
        <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
        <span class="lab">日期</span><span class="val accent num">今天 9月12日</span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div class="prop">
        <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 20a2 2 0 01-3.4 0"/></svg>
        <span class="lab">提醒</span><span class="val num">18:00</span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div class="prop">
        <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="var(--soon)" stroke="var(--soon)" stroke-width="1.6"><path d="M5 21V4c4-2 7 2 11 0v9c-4 2-7-2-11 0"/></svg>
        <span class="lab">优先级</span><span class="val">高</span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div class="prop">
        <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3.3 8.2L12 13l8.7-4.8M12 13v9"/></svg>
        <span class="lab">清单</span><span class="val">工作</span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div class="prop">
        <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4L11 3.8A2 2 0 009.6 3.2H5a2 2 0 00-2 2v4.6c0 .5.2 1 .6 1.4l9.6 9.6a2 2 0 002.8 0l4.6-4.6a2 2 0 000-2.8z"/><circle cx="8" cy="8" r="1.4" fill="currentColor" stroke="none"/></svg>
        <span class="lab">标签</span><span class="val" style="color:var(--accent)">博客 · 技术债</span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div class="prop">
        <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.5 2M9.5 2.5h5"/></svg>
        <span class="lab">预计</span><span class="val num">45 分钟</span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
    </div>

    <div class="eyebrow"><span class="lab">子任务</span><span class="cnt num">1/3</span><span class="rule"></span></div>
    <div class="sub"><span class="c done"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span><span class="n done">列出第三方依赖清单</span></div>
    <div class="sub"><span class="c"></span><span class="n">替换评论系统为自托管</span></div>
    <div class="sub"><span class="c"></span><span class="n">验证构建与 RSS 输出</span></div>
    <div class="subadd"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>添加子任务</div>

    <div class="eyebrow"><span class="lab">备注</span><span class="rule"></span></div>
    <div class="notes">把评论系统和统计脚本换掉，文章正文不动。替换后注意观察一周的构建耗时和访问速度。</div>
  </div>

  <div class="actionbar">
    <span class="savestate num">已保存 11:02</span>
    <span class="btn ghost">完成</span>
    <span class="btn primary">保存</span>
  </div>
</body>
</html>
