# Production on home-app (11022): GHCR server image (API + SPA 静态托管), external Postgres.
# Entry nginx (39.96.159.212) reverse-proxies https://vital.aimo.plus → :13005 → server:3010.
#
#   cp .env.production.example .env   # fill secrets; WEB_ORIGIN=https://vital.aimo.plus
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml run --rm migrate
#   docker compose -f docker-compose.prod.yml up -d
#
# On the app host this file is copied to /root/apps/vital/docker-compose.yml.

name: vital

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-app: &app
  env_file: .env
  environment:
    NODE_ENV: production
  restart: unless-stopped
  logging: *logging
  pull_policy: always

services:
  migrate:
    <<: *app
    image: ghcr.io/ximing/vital-server:${VITAL_IMAGE_TAG:-stable}
    container_name: vital-migrate
    command: ['node', 'dist/db/migrate.js']
    restart: 'no'

  server:
    <<: *app
    image: ghcr.io/ximing/vital-server:${VITAL_IMAGE_TAG:-stable}
    container_name: vital-server
    # 入口 nginx（39.96.159.212）反代 https://vital.aimo.plus → 这里；server 同时托管 SPA 静态资产
    ports:
      - '${VITAL_WEB_BIND:-0.0.0.0}:${VITAL_WEB_PORT:-13005}:3010'
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: '3010'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:3010/api/health").then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  worker:
    <<: *app
    stop_grace_period: 5m
    image: ghcr.io/ximing/vital-server:${VITAL_IMAGE_TAG:-stable}
    container_name: vital-worker
    command: ['node', 'dist/worker.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      ALL_PROXY: ''
      http_proxy: ''
      https_proxy: ''
      all_proxy: ''
